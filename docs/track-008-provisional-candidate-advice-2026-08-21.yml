schema_version: "1.0.0"
track: "008-semantic-backbone"
status: "advisory"
question: "What should follow satisfaction of the Track 002 and 007 dependencies?"
options:
  - id: "A"
    action: "Seek all qualifying external receipts immediately."
    trade_offs: "Highest assurance, but slow and coordination-dependent."
    contingencies: "Exclude or disable sources whose terms or fitness cannot be established."
  - id: "B"
    action: "Bind a provisional synthetic/public candidate while keeping Track 008 blocked."
    trade_offs: "Maximises reversible progress and makes later requests exact, but cannot unlock Track 009."
    contingencies: "Candidate drift invalidates the packet and requires new hashes and challenge."
  - id: "C"
    action: "Narrow eventual semantic scope to sources with defensible exact-release rights."
    trade_offs: "May reduce rights burden, but reduces coverage and does not waive naming or review gates."
    contingencies: "Retain synthetic identifiers where attributable naming authority is unavailable."
rationale: "Dependencies are satisfied, while four substantive rights, fitness and naming findings remain open."
recommendation: "B now, followed by A against the exact candidate."
identifier_boundary: >-
  ORPHA-shaped identifiers are schema exercise tokens. Their appearance does
  not establish fictitiousness, validated correspondence, mapping fitness,
  clinical meaning or permission to redistribute source records.
self_baseline_boundary: >-
  The zero-change migration receipt compares the candidate with itself. It is
  not evidence of ontology-update compatibility, mapping fitness, completeness,
  naming authority or real-world safety.
governance:
  panel_output: "advisory"
  owner_disposition: "not_recorded"
  independent_review: false
blocked_claims:
  - "approved ontology pins"
  - "clinical or patient/community naming authority"
  - "independent semantic review"
  - "v0.4 contract freeze"
  - "Track 009 activation"
