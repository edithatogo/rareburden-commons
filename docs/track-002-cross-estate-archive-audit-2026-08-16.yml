routing_rules:
  - "reuse an existing path/hash receipt; never re-upload equivalent bytes"
  - "public bytes require affirmative exact-artifact redistribution rights"
  - "licensed or mixed-rights bytes remain private; metadata remains public"
  - "publisher login, click-through, robots and rate limits are never bypassed"
  - "missing history/language/country evidence remains a gap, not an absence claim"
claims:
  all_versions_complete: false
