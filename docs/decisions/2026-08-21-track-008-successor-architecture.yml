options:
  - id: A
    title: Select distinct-successor architecture for later implementation
    disposition: narrow
    trade_offs:
      - Preserves historical Track 008 meaning and creates explicit bounded-infrastructure and external-assurance gates.
      - Requires successor specifications, reference migration and atomic mode-gate implementation.
    contingencies:
      - Keep historical Track 008, both proposed successors and Track 009 blocked until a separate exact implementation packet is decided.
      - If a consumer cannot express the mode gate, leave it blocked on historical Track 008.
      - If derivative rights fail, exclude the artifacts from future release surfaces and preserve a transparent correction record.
    rationale: The architecture is bounded, traceable and fail-closed without changing live programme state.
    minimum_evidence:
      - Exact candidate 9b35ab4660137624000bed114d0ced120d7d62a9 and tree e75a24401a90b1dea7af563580d6527fe0d5270a.
      - Proposal SHA-256 4809721d8d9d506592da6dcf642cf6459d503e94a5382f608353d0fcfc7ae8f9.
      - Explicit owner decision limited to architecture selection and implementation-candidate preparation.
  - id: B
    title: Revise architecture evidence before selection
    disposition: revise
    trade_offs:
      - Adds implementation-grade mode, consumer and rollback detail before architecture selection.
      - Delays a decision and may duplicate work in the later implementation candidate.
    contingencies:
      - Add separate modes for empirical, public-facing, clinical, patient-facing and authority-bearing use, then re-panel.
    rationale: Appropriate if the owner requires implementation-grade enforcement in the architecture artifact itself.
    minimum_evidence:
      - Superseding exact candidate, negative tests and a new pending packet.
  - id: C
    title: Defer the split and retain historical Track 008
    disposition: defer
    trade_offs:
      - Avoids migration complexity but leaves Track 008 and Track 009 blocked under the original contract.
    contingencies:
      - Preserve the bounded v0.4 freeze and revisit only with new evidence or a new architecture.
    rationale: Deferral is safest if successor migration is not currently wanted.
    minimum_evidence:
      - No additional evidence; preserve current blocked states.
recommendation:
