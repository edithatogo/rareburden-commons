decided_by: "edithatogo"
accountable_role: "repository owner and sole accountable human"
owner_instruction: "I approve your recommendations."
context:
  exact_semantic_candidate_commit: "47f1a9159e85bfa8112c18ca1c1c69b29e99b4cd"
  exact_semantic_candidate_tree: "af2bc0074ae6c77a65f8c47da04431b08baca77f"
