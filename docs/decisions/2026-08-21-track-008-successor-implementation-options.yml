evidence:
  references:
    - docs/candidates/track-008-successors/implementation-candidate.yml
    - docs/candidates/track-008-successors/dependency-modes.yml
    - docs/candidates/track-008-successors/reference-migration.yml
    - docs/candidates/track-008-successors/019-spec.md
    - docs/candidates/track-008-successors/020-spec.md
  observed_facts:
    - Candidate 666d44e adds non-operative candidate documents, a validator and tests; it does not change live tracks or dependencies.
    - Both successor metadata candidates are blocked and historical Track 008 is proposed as superseded-not-complete.
    - Eight semantic-use modes are explicit, unknown modes deny, and every high-risk mode names Tracks 019 and 020 plus external evidence labels.
    - Local Python 3.14 make check passed with 1111 tests.
    - The branch is behind current origin/main and has no hosted exact-head evidence.
  simulated_assessments:
    - The design preserves the intended identity, harm and rights boundaries.
    - The current validator proves candidate structure, not operational receipt validity, atomic application or rights clearance.
