prohibited_uses:
  - re-identification or differencing attacks
  - individual eligibility, policing, immigration, employment or insurance decisions
  - commercial profiling
  - unsupported ranking of people, communities, diseases or services
  - rationing or worth-ranking inferred mechanically from burden or cost outputs
  - reuse beyond the recorded purpose and authority
unsafe_premises:
  - Synthetic success and hash reconciliation do not establish social licence, Indigenous authority, real-world privacy, representativeness, clinical validity or custodian acceptability.
  - Administrative visibility and referral patterns are not unbiased measures of prevalence, need or service quality.
  - Owner-operated reproduction is repository evidence and cannot be promoted to independent replication.
  - A public-facing naming freeze cannot manufacture acceptance of contested or harmful terminology.
dissent:
  - A synthetic/public-only repository may use agent advice and owner disposition for repository controls under ADR-0009, but it must not relabel that process as community, Indigenous, custodian or independent approval.
stop_triggers:
  - no lawful purpose-specific custodian or source pathway
  - unresolved critical naming, cultural-governance, privacy or disclosure harm
  - inability to produce a privacy-safe output
  - prohibited-use enablement without enforceable controls
  - rights, provenance, dependency, candidate or hash mismatch
  - external authority, partnership or approval inferred from repository-owned evidence
owner_disposition:
