    - repository-owned patient and community governance challenge
    - advisory recommendations for repository-owner disposition
    - synthetic-only safe-continuation boundaries
  does_not_establish:
    - patient or community consultation, consent, endorsement or authority
    - Indigenous authority or Indigenous data-governance approval
    - custodian, ethics, privacy, clinical, scientific, security or legal approval
    - independent review, external replication or second-operator independence
    - real-data activation, public release or redistribution permission
overall_recommendation: narrow_and_defer_external_activation
