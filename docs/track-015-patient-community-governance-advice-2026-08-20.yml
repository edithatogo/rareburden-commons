      - separate health-system, household and societal outputs
      - uncertainty, missingness, remuneration and translation planning
    retained_gates:
      - health-economics and ethics panel lanes
      - attributable patient or family co-design where claimed
      - approval for new data collection
  - cluster: federated_and_paediatric_pathways
    tracks: ['004', '012']
    disposition: defer_real_pilot
    permitted_now:
      - synthetic installation, audit, revocation and safe-failure exercises
      - synthetic paediatric linkage, deduplication, small-cell and suppression tests
      - non-binding custodian and operator materials
    retained_gates:
      - supplying-custodian policy and deployment authority
      - jurisdictional ethics, linkage, privacy and security requirements
      - applicable Indigenous data authority
      - genuinely separate operator evidence when such independence is claimed
  - cluster: quality_equity_and_release
    tracks: ['013', '014']
