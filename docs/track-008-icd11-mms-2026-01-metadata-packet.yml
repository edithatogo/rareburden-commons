  mapping_assessment:
    - "lawful access to the exact 2026-01 MMS content required for the stated purpose"
    - "versioned mapping inputs and directional relation semantics"
    - "unmapped, ambiguous, broader, narrower and deprecated counts"
    - "demonstrator-specific impact and sensitivity assessment"
