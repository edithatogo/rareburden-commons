    - "owner source-use decision bound to exact evidence"
    - "methods, rights and engineering review of the exact mapping candidate"
  redistribution:
    - "express file, response and field-level redistribution authority"
    - "required attribution, notices and withdrawal procedure"

stop_triggers:
  - "A workflow treats this packet as classification content or a mapping release."
  - "The MMS linearization, release, language or API version is silently substituted."
  - "Any public artifact includes response or terminology bytes without exact rights evidence."
  - "Any empirical, clinical, completeness or external-approval claim is inferred from this packet."

panel_options:
