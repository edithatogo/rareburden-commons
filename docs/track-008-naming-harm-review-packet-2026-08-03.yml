schema_version: "0.1.0"
track: "008-semantic-backbone"
status: "panel_preparation_only"
candidate_scope: "synthetic_public_semantic_preview"
accountable_boundary: "panel findings do not constitute patient/community or clinical authority"
review_items:
  - id: "NAME-01"
    subject: "preferred labels and synonyms"
    evidence: "synthetic hierarchy labels and mapping release"
    decision: "bounded_revision_required"
    panel_finding: "Keep clinical-sounding labels visibly synthetic and non-diagnostic."
  - id: "NAME-02"
    subject: "syndrome, aetiology and residual grouping"
    evidence: "aggregation contracts and unsupported-mapping rules"
    decision: "bounded_revision_required"
    panel_finding: "Avoid labels that conflate distinct and unresolved categories."
  - id: "NAME-03"
    subject: "stigma, identity and misclassification risk"
    evidence: "plain-language label alternatives and exclusion notes"
    decision: "bounded_revision_required"
    panel_finding: "Use neutral unresolved/other wording and expose unknown status."
  - id: "NAME-04"
    subject: "accessibility and interpretation limits"
    evidence: "human-readable semantic release and limitations"
    decision: "bounded_revision_required"
    panel_finding: "Add plain-language definitions and prominent non-clinical limitations."
required_panel_output:
  - "label_or_grouping"
  - "risk_or_harm"
  - "affected_constituency"
  - "proposed_mitigation"
  - "residual_uncertainty"
  - "dissent"
  - "recommendation: accept|revise|bounded|reject"
owner_disposition_options:
  - "release_bounded"
  - "revise"
  - "stop"
fail_closed_rules:
  - "contested terminology remains unresolved or conservatively labelled"
  - "critical harm without mitigation blocks candidate release"
  - "panel output cannot be recorded as constituted community consent"
