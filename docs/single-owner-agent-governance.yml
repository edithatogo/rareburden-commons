schema_version: "1.0.0"
repository: edithatogo/rareburden-commons
effective_date: "2026-08-21"
application: prospective_material_decisions
historical_role_metadata_rewritten: false
owner:
  identity: edithatogo
  human_count: 1
  accountability: sole_accountable_repository_human
  repository_roles:
    - owner
    - maintainer
    - developer
    - approver
    - scientist
    - operator
    - security_decision_maker
    - release_decision_maker
  decision_authority: repository_scope_and_release_only
  decides_after_agent_advice: true
  absence_or_compromise_action: freeze_protected_changes_production_and_release
agent_panel:
  simulation_status: simulated_role_separated_advisory_panel
  minimum_perspectives: 3
  perspectives_are_independent_people: false
  required_packet_schema: schemas/agent-owner-decision-packet.schema.json
  required_options_minimum: 2
  required_options_maximum: 3
  required_presentation: [options, trade_offs, contingencies, rationale, recommendation, uncertainty, dissent, stop_triggers]
  recommendation_is_approval: false
  has_accountability_or_authority: false
  agents_are_maintainers: false
external_evidence_providers:
  repository_accountability: false
  repository_maintainer_status: false
  may_supply_attributable_evidence: true
  evidence_does_not_transfer_repository_authority: true
continuity:
  additional_accountable_human: prohibited_without_dated_governance_transition
  backup_owner_or_co_maintainer: none
  recovery_material_confers_authority: false
  owner_unavailable_action: fail_closed
  future_human_transition_required: true
external_fact_boundary:
  simulation_cannot_create:
    - publisher_licence_or_source_terms
    - third_party_rights
    - registry_event
    - credential_or_live_service_capacity
    - controlled_data_custodian_permission
    - clinical_validity_or_authority
    - patient_or_community_consent
    - patient_or_community_representation
    - indigenous_authority_or_consent
    - partnership_or_endorsement
    - institutional_or_external_approval
    - independent_review_evidence
  unresolved_fact_action: narrow_defer_or_stop
claims_boundary:
  simulated_community_harm_perspective_is_lived_experience: false
  simulated_panel_is_independent_review: false
  metadata_establishes_content_quality_or_absence: false
  metadata_establishes_language_or_geographic_representativeness: false
  metadata_establishes_novelty_partnership_or_community_authority: false
decision_rule:
  exact_candidate_binding_required: true
  dissent_and_uncertainty_preserved: true
  unresolved_critical_finding: narrow_revise_defer_or_stop
  owner_disposition_required: true
  owner_operated_work_is_independent_review: false
