  findings:
    - id: wording
      severity: medium
      disposition: bounded
      finding: Global and representative language is not supported by current coverage.
      action: Use bounded geography, source, period and missingness statements only.
    - id: actionability
      severity: medium
      disposition: bounded
      finding: Synthetic and provisional estimates cannot support allocation or eligibility decisions.
      action: Restrict use to methods demonstration and evidence-gap planning.
    - id: comparability
      severity: medium
      disposition: bounded
      finding: Cross-country comparison requires harmonised estimands and visible source differences.
      action: Suppress ranking and expose non-comparability.
