name: dependency vulnerability audit

on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
  push:
    paths:
      - uv.lock
      - requirements.txt
      - requirements-dev.txt
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked audit environment
        run: |
          uv python install "3.13"
          uv sync --frozen --extra dev --python "3.13"
      - name: Audit locked production dependencies
        run: uv run --python "3.13" pip-audit --require-hashes -r requirements.txt
      - name: Audit locked development dependencies
        run: uv run --python "3.13" pip-audit --require-hashes -r requirements-dev.txt
