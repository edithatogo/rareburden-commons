name: bounded public archive history discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-public-archive-history-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Discover bounded official metadata
        run: |
          python3 scripts/discover_public_archive_history.py \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --delay-seconds 1 \
            --output public-history-products.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bounded-public-history-products
          path: public-history-products.json
          if-no-files-found: error
          retention-days: 30
