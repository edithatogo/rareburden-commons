name: continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install supported Python and locked environment
        run: |
          uv python install "${{ matrix.python-version }}"
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: Run offline programme and unit checks
        run: uv run --python "${{ matrix.python-version }}" make check

  assurance:
    name: Coverage, reproducibility and distribution assurance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked assurance environment
        run: |
          uv python install "3.13"
          uv sync --frozen --extra dev --python "3.13"
      - name: Run complete assurance harness
        run: uv run --python "3.13" make ci
      - name: Build and inspect distributions
        run: uv run --python "3.13" make build package-check installed-package-check sbom
      - name: Upload test and distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assurance-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            coverage.json
            coverage.xml
            junit.xml
            rareburden.cdx.json
            dist/*

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: |
          uv python install "3.13"
          uv sync --frozen --extra dev --python "3.13"
      - name: Run portable programme and test checks
        run: uv run --python "3.13" python -m pytest
      - name: Validate programme and installed CLI
        run: |
          uv run --python "3.13" rareburden validate-programme --json
          uv run --python "3.13" rareburden doctor --json
      - name: Exercise installed wheel outside the checkout
        run: |
          uv run --python "3.13" make build
          uv run --python "3.13" make installed-package-check
