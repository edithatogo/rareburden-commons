schema_version: 1.0.0
software:
  name: rareburden
  title: RareBurden Commons
  version: 0.3.0rc2
  release_date: '2026-07-19'
  description: >-
    Open, reproducible infrastructure and reference software for measuring the
    collective health, social and economic burden of rare diseases.
  abstract: >-
    RareBurden Commons provides data-acquisition, provenance, semantic,
    evidence-ledger, burden-estimation, federated-analysis and release-assurance
    components for the Global Rare Disease Burden Initiative. Pre-v1 releases
    are research software and synthetic assurance infrastructure, not clinical
    decision-support tools or definitive global burden estimates.
  software_license: Apache-2.0
  documentation_license: CC-BY-4.0
  programming_language: Python
  development_status: pre-release
  resource_type: Software
  publisher: RareBurden Commons contributors
  creators:
    - name: RareBurden Commons contributors
      type: Organization
  keywords:
    - rare diseases
    - burden of disease
    - health economics
    - epidemiology
    - provenance
    - reproducible research
    - federated analysis
  related_standards:
    - name: RO-Crate
      version: '1.3'
      url: https://w3id.org/ro/crate/1.3
    - name: Process Run Crate
      version: '0.5'
      url: https://w3id.org/ro/wfrun/process/0.5
    - name: GATHER
      version: '2016'
      url: https://www.who.int/data/gather
  identifiers: []
