programme:
  name: RareBurden Commons
  roadmap_version: 0.5.0
  stable_release: 1.0.0
  status: pre_release
  planning_model: gate_based
  roadmap_document: docs/roadmap-v1.md
  stable_acceptance_contract: docs/v1-acceptance-criteria.md
releases:
- version: 0.1.0
  name: Foundation
  status: released
  objective: Establish the programme thesis, architecture, protocol, source catalogue and executable validation
    scaffold.
  tracks:
  - 001-foundation
  exit_gates:
  - Foundation acceptance criteria pass.
  - Offline catalogue validation and repository safety checks pass.
  - No burden estimate or partner access is implied.
- version: 0.2.0
  name: Programme control plane
  status: released
  objective: Define and machine-validate the complete track portfolio, maturity model and stable v1 release contract.
  tracks:
  - 006-v1-delivery-system
  exit_gates:
  - Every roadmap track has a specification, plan and valid metadata.
  - Dependencies are acyclic and each track is assigned to exactly one release.
  - Must requirements and known foundation gaps are traced.
  - Git clone and clean source archive pass the documented checks.
- version: 0.3.0
  name: Evidence acquisition foundation
  status: released
  objective: Prove lawful, versioned public-source acquisition, validate the programme's novelty and adjacency,
    and establish auditable scholarly provenance.
  tracks:
  - 002-public-source-acquisition
  - 007-landscape-novelty
  - 018-scholarly-provenance-reproducibility
  exit_gates:
  - Supported sources produce manifests and schema-valid normalised fixtures.
  - Source changes and licence uncertainty fail safely.
  - Landscape review records a proceed, narrow, combine, revise or stop decision.
  - Synthetic reference releases provide verified protocol, decision, transformation, PROV, lineage, reporting and
    reproducibility evidence.
- version: 0.4.0
  name: Semantic evidence core
  status: current
  objective: Create the versioned disease hierarchy, mapping layer and evidence/parameter ledger.
  tracks:
  - 008-semantic-backbone
  - 009-evidence-parameter-ledger
  exit_gates:
  - Demonstrator entities map without silent parent-child or multi-diagnosis overlap.
  - Parameters have provenance, uncertainty, quality and transportability metadata.
  - Schema migrations and version diffs are tested.
- version: 0.5.0
  name: Public burden engine alpha
  status: planned
  objective: Implement reproducible burden calculations and validate them through the monogenic-diabetes demonstrator.
  tracks:
  - 010-public-burden-engine
  - 003-monogenic-diabetes-demonstrator
  exit_gates:
  - Deterministic and simulation reference analyses reproduce from release artefacts.
  - Unsupported metric or envelope combinations fail safely.
  - Agent-panel scientific challenge and repository-owner disposition are complete.
- version: 0.6.0
  name: Federated methods alpha
  status: planned
  objective: Prove portable local execution and a second multi-aetiology rare-within-common analysis.
  tracks:
  - 004-federated-node-runner
  - 011-bronchiectasis-demonstrator
  exit_gates:
  - Synthetic node execution and disclosure tests pass.
  - An owner-operated clean-environment run reproduces the documented node workflow.
  - Bronchiectasis analysis validates overlapping and unclassified aetiology handling.
- version: 0.7.0
  name: Economic and paediatric beta
  status: planned
  objective: Add economic/social burden contracts and a paediatric controlled-data demonstrator specification.
  tracks:
  - 005-economic-social-burden
  - 012-paediatric-burden-demonstrator
  exit_gates:
  - Economic perspective, units, price year and component overlap are explicit.
  - Paediatric workflow passes synthetic linked-data and disclosure tests.
  - Controlled-data claims are bounded by actual approvals.
- version: 0.8.0
  name: Validated atlas beta
  status: planned
  objective: Publish quality-graded, uncertainty-forward aggregate products and a reproducible atlas/API beta.
  tracks:
  - 013-quality-validation-gap-equity
  - 014-atlas-api-release
  exit_gates:
  - Machine-readable and human-readable public-data gap maps are released.
  - At least one analysis has been reproduced in a clean owner-operated environment.
  - Atlas and API outputs expose provenance, uncertainty, quality and missingness.
- version: 0.9.0
  name: Release candidate
  status: planned
  objective: Apply the single-developer agent-panel governance model and harden security, reliability, performance, operations and support.
  tracks:
  - 015-governance-partnership-policy
  - 016-security-reliability-operations
  exit_gates:
  - Agent-panel governance, owner disposition and applicable rights policies are operational; no constituted body is claimed.
  - Threat model, locked build, SBOM, signing/attestation and recovery exercises pass.
  - No unresolved blocking governance, privacy, security or operational finding remains.
- version: 1.0.0
  name: Stable public infrastructure
  status: planned
  objective: Demonstrate agent-challenged usability, owner-operated reproducibility, sustainable ownership and complete the stable release
    contract.
  tracks:
  - 017-documentation-adoption-v1
  exit_gates:
  - Every blocking criterion in docs/v1-acceptance-criteria.md has linked evidence.
  - Two clean release-candidate builds and one separately executed owner-operated reproduction agree.
  - Supported scope, single-owner support, continuity limits and sustainability are recorded by the owner.
  - Agent-panel lane recommendations and an exact-candidate owner decision authorise the v1.0.0 tag.
- version: 1.1.0
  name: External governance and partnership activation
  status: planned
  objective: Activate only evidence-backed external governance, country-node, partnership and representation claims after stable v1.
  tracks:
  - 021-external-governance-activation
  exit_gates:
  - Every activated authority or relationship has an attributable scope-matched receipt.
  - Country-node and global claims remain disabled unless their representation conditions pass.
