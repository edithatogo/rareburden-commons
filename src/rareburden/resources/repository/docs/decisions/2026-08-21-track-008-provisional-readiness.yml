uncertainty:
  - The apparent ORPHA identifiers may correspond to real source identifiers; the repository makes no fictitiousness or validated-correspondence claim.
  - HPO rights remain asset-specific, WHO redistribution remains unresolved, and UMLS or SNOMED permissions remain edition and credential specific.
  - No final real-source mapping set, naming list, ontology-update comparison or public rendering path is approved.
dissent:
  - The simulated harm perspective prefers unmistakably synthetic identifiers or persistent watermarks before any public rendering.
  - The simulated engineering perspective considers the revised byte-bound readiness mechanism acceptable without changing fixtures, provided context and blocked claims cannot be stripped.
stop_triggers:
  - Any candidate commit, tree, artifact or evidence hash drift after owner review.
  - Any unresolved HPO, WHO, UMLS or SNOMED bytes entering a public artifact or metadata being treated as permission.
  - Any source-shaped token or accepted, exact or high label being presented as clinically validated or community approved.
  - Any attempt to freeze v0.4, complete Track 008 or activate Track 009 from this readiness evidence.
  - Any inference of owner selection from the recommendation, tests, metadata or prior discussion rather than an exact-candidate disposition.
options:
  - id: A
    title: Narrowly accept revised readiness candidate
    disposition: narrow
    trade_offs:
      - Preserves useful exact-byte and Git-object readiness controls while leaving every substantive source, fitness, naming and freeze gate unresolved.
      - Retains recognizable source-shaped tokens whose context could be lost in a future rendering.
    contingencies:
      - Keep Track 008 blocked and all authority, freeze and Track 009 flags false.
      - Supersede and re-review the packet on any candidate, source, terms, rendering or evidence change.
      - Replace or persistently watermark source-shaped tokens before any approved public surface if context cannot be guaranteed.
    rationale: >-
      The panel's requested reconciliation, Git-object verification,
      self-baseline limitation and identifier clarification are implemented,
      supporting readiness infrastructure only.
    minimum_evidence:
      - Exact candidate commit e602a9a8ebe089f3f02c0377da5c13f81416b980 and tree c86d855a35670977204279255e0fd71f15d57681.
      - Schema-valid pending decision packet and SHA-256-bound evidence manifest.
      - Python 3.12, 3.13 and 3.14 hosted checks on the eventual PR head before merge.
  - id: B
    title: Revise identifiers before acceptance
    disposition: revise
    trade_offs:
      - Further reduces context-loss risk by replacing source-shaped tokens or enforcing persistent synthetic watermarks.
      - Causes fixture, fingerprint and evidence hash churn without adding source rights, mapping fitness or community authority.
    contingencies:
      - Regenerate every affected fixture, release, manifest, migration receipt and hash before a new panel review.
      - Retain the present candidate unmerged if replacement breaks deterministic semantic tests.
    rationale: >-
      This is the safer option if future public rendering cannot reliably keep
      limitations adjacent to recognizable identifiers and mapping labels.
    minimum_evidence:
      - A rendering-path decision specifying how synthetic status remains visible.
      - Regenerated exact candidate, fingerprints, manifests, migration receipt and tests.
  - id: C
    title: Defer readiness candidate
    disposition: defer
    trade_offs:
      - Avoids present inference risk but discards useful reversible provenance plumbing and delays Track 008 preparation.
    contingencies:
      - Keep current main readiness state and recreate a candidate when source-specific or naming evidence materially changes.
    rationale: >-
      Deferral is appropriate if the owner does not want any source-shaped
      provisional semantic artifacts retained before stronger evidence exists.
    minimum_evidence:
      - A later exact candidate and new simulated panel packet.
recommendation:
  option_id: A
  rationale: >-
    Narrowly accept the revised candidate as readiness infrastructure only;
    it is now reproducibly bound while every substantive authority and freeze
    claim remains false and fail-closed.
owner_decision:
  status: pending
