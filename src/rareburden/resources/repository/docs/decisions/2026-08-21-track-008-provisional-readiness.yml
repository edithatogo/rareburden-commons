  simulated_assessments:
    - The revised controls are useful reversible readiness infrastructure when all authority and freeze flags remain false.
    - ORPHA-shaped identifiers remain context-loss risks and require persistent schema-exercise limitations wherever rendered.
    - Source-family metadata is insufficient evidence of mapping fitness, clinical validity, complete rights or permission for derivatives.
  cannot_infer:
    - approved ontology pins or complete source rights
    - mapping fitness, clinical validity or diagnostic meaning
