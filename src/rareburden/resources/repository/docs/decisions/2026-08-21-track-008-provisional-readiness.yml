options:
  - id: A
    title: Narrowly accept revised readiness candidate
    disposition: narrow
    trade_offs:
      - Preserves useful exact-byte and Git-object readiness controls while leaving every substantive source, fitness, naming and freeze gate unresolved.
      - Retains recognizable disease labels and authoritative-looking mapping-status words whose context could be lost in a future rendering.
    contingencies:
      - Keep Track 008 blocked and all authority, freeze and Track 009 flags false.
      - Supersede and re-review the packet on any candidate, source, terms, rendering or evidence change.
      - Add persistent synthetic, non-clinical and non-community-approved warnings before any approved public surface if context cannot be guaranteed.
    rationale: >-
      The panel's requested reconciliation, Git-object verification,
      self-baseline limitation and unmistakably synthetic identifiers are implemented,
      supporting readiness infrastructure only.
    minimum_evidence:
      - Exact candidate commit b799130059c9c0be625491b21c4376d1057e65f7 and tree 27c5f632f8994d12bff9f6d957985bd9c206f386.
      - Schema-valid pending decision packet and SHA-256-bound evidence manifest.
      - Python 3.12, 3.13 and 3.14 hosted checks on the eventual PR head before merge.
  - id: B
    title: Add persistent rendering safeguards
    disposition: revise
    trade_offs:
      - Further reduces context-loss risk by enforcing persistent synthetic, non-clinical and non-community-approved warnings.
      - Expands scope into renderer and export behavior without adding source rights, mapping fitness or community authority.
    contingencies:
      - Define and test every renderer or export path before a new panel review.
      - Retain the present candidate as internal readiness evidence if no public renderer is activated.
    rationale: >-
      This is the safer option if public rendering is now in scope and must
      reliably keep limitations adjacent to labels and mapping statuses.
    minimum_evidence:
      - A rendering-path decision specifying how synthetic status remains visible.
      - Tests proving warnings persist through each enabled renderer and export.
  - id: C
    title: Defer readiness candidate
    disposition: defer
    trade_offs:
      - Avoids present inference risk but discards useful reversible provenance plumbing and delays Track 008 preparation.
    contingencies:
      - Keep current main readiness state and recreate a candidate when source-specific or naming evidence materially changes.
    rationale: >-
      Deferral is appropriate if the owner does not want provisional semantic
      artifacts retained before stronger evidence exists.
    minimum_evidence:
      - A later exact candidate and new simulated panel packet.
