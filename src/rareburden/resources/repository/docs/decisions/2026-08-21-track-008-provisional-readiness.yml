    - manifests/semantics/track-008-provisional-candidate-2026-08-21.json
    - manifests/semantics/track-008-provisional-migration-impact-2026-08-21.json
    - docs/track-008-provisional-candidate-advice-2026-08-21.yml
    - docs/track-008-freeze-readiness-2026-08-21.yml
    - docs/track-008-source-release-inventory-2026-08-03.yml
  observed_facts:
    - The reconciled candidate is based on current main and preserves both post-upstream reconciliation and exact-candidate readiness records.
    - The manifest identifies eight schema or synthetic-fixture artifacts at historical source commit a87a7b62b8c7cbe69deee868cc50f195af6f7cb7 and tree 3dc08a4940dfab39c81b5a2cdc5efa1a3b583ccc.
