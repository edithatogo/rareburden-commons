  title: "accept_freeze_for_synthetic_and_bounded_public_aggregate_scope"
  rationale: >-
    The estimand and denominator contracts are fit for the declared v0.4
    scope. Freeze the contract version for that scope while recording that
    empirical fitness for activated real sources is out of scope and stays
    behind exact-receipt activation gates.
  conditions:
