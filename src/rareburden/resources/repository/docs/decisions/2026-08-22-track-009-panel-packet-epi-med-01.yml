perspectives:
  - role: "epidemiology_and_methods"
    observed:
      - "Ledger records bind every parameter to population_id, geography_id, sex, period, measure, metric, unit and semantic entity IDs; incompatible combinations cannot merge silently."
      - "evidence_status distinguishes observed, transformed, synthesised, transferred, modelled and assumed; synthetic fixtures are labelled as such with explicit limitations."
      - "Denominator contracts carry quantified uncertainty and source-release links."
    assessed:
      - >-
        For the declared scope (synthetic preparation plus bounded public
        aggregates), the estimand and denominator contracts are internally
        fit for purpose: they encode population alignment, period alignment,
        measure/metric/unit typing and provenance required by the spec's
        acceptance criteria 1-7.
    cannot_infer:
      - "Empirical sufficiency of any future real-world denominator or fraction; that requires exact source receipts under the real-data mandate."
      - "Clinical or epidemiological validity of any activated estimate."
    dissent: []
  - role: "semantic_and_engineering"
    observed:
      - "Schemas reject missing mandatory provenance, uncertainty and evidence status; revision history preserves superseded values."
      - "The v0.4 candidate manifest binds exports and inputs by sha256 and re-verification against baseline de168db4 passed."
    assessed:
      - "Contract freeze would be mechanically sound: schemas, validators and fixtures support a versioned frozen contract with supersession semantics."
    cannot_infer:
      - "Fitness of contracts for analytic modes not yet specified (federated execution, modelled transfer beyond current types)."
    dissent: []
  - role: "community_and_harm"
    observed:
      - "Synthetic parameters explicitly disclaim official-status and avoid implying real denominators for named jurisdictions beyond labelled synthetic assurance values."
    assessed:
      - >-
        No harm pathway is opened by freezing the contract itself; harm risk
        attaches only when real estimates are activated and published, which
        remains behind separate gates.
    cannot_infer:
      - "Community acceptance of any future published estimate."
    dissent: []
recommendation:
