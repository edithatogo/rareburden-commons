    - docs/track-004-integration-options-2026-09-01.md
    - manifests/node/track004-integration-options-20260901.json
    - conductor/tracks/004-federated-node-runner/spec.md
  observed_facts:
    - Existing synthetic aggregation, export and durable query-registration primitives are separate.
    - The reference store does not return a transaction-bound policy snapshot with an operator-pinned expected hash.
    - The proposal candidate passed full local make check with 1770 tests; no integration was implemented.
  simulated_assessments:
    - A makes conservative reservation and failure semantics testable without claiming production trust.
