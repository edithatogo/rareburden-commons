      Estimand and denominator contracts are fit for synthetic and
      exactly-receipted public-aggregate scope; empirical fitness for any
      activated real source remains behind exact-receipt activation gates.
  RIGHTS-01:
    ruling: "accepted_narrowed"
    scope: >-
      No custodian receipt is required for the synthetic-only candidate or
      recorded public-source terms dispositions under ADR-0009. Controlled
      data remains wholly outside v0.4 scope and fails closed.
  ENG-01:
    ruling: "partially_evidenced_owner_operated"
    note: "Owner-operated engineering receipt recorded in #250; independent engineering review is not claimed and not required by ADR-0009."
