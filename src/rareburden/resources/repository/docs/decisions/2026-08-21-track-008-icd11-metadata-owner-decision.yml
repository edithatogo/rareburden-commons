  observed_facts:
    - "The checked-in inventory identifies ICD-11 MMS 2026-01, English, API v2, release date 2026-01-17."
    - "The exact release-metadata response observation has status 200, size 2056 bytes and a recorded SHA-256."
    - "No new credential use, network retrieval, response bytes, mapping rows or source activation are in the candidate."
  simulated_assessments:
    - "Methods and rights advice preferred ICD because it has the strongest exact-release evidence and direct Track 008 relevance."
    - "Engineering preferred a GHED readiness packet because it would have less semantic and provenance coupling."
    - "The narrow packet addresses the dissent by prohibiting mapping, content, scientific-fitness and activation claims."
  cannot_infer:
