uncertainty:
  - "The response hash identifies release metadata bytes, not the complete terminology graph."
  - "No demonstrator mapping has been assessed against this release."
  - "Exact permitted-use and redistribution terms remain unresolved."
dissent:
  - "Engineering recommends preparing a GHED selection-readiness packet first to avoid semantic coupling; GHED cannot yet be called an exact-release packet."
stop_triggers:
  - "Any workflow treats the metadata observation as classification content or a mapping release."
  - "Any release, language, linearization or API version is silently substituted."
  - "Any public artifact includes response or terminology bytes without exact rights evidence."
  - "Any empirical, clinical, completeness or external-approval claim is inferred."
options:
  - id: "A"
    title: "Bind exact ICD metadata observation"
    disposition: "accept"
    trade_offs:
      - "Provides the strongest exact release identity and Track 008 utility, while adding no mapping or empirical readiness."
    contingencies:
      - "Keep content, access, retention, rights, mapping-fitness and activation gates disabled."
    rationale: "Track 008 explicitly requires pinned ICD release identity and existing repository evidence supports this narrow observation."
    minimum_evidence:
      - "Exact inventory binding, negative authority flags, focused tests and synchronized runtime assets."
  - id: "B"
    title: "Prepare GHED readiness first"
    disposition: "defer"
    trade_offs:
      - "Has less semantic coupling but lacks a selected immutable release, file, checksum and field-level terms."
    contingencies:
      - "Prepare a requirements-only packet with every release field unresolved."
    rationale: "This preserves engineering's lower-coupling alternative but cannot yet satisfy an exact-release objective."
    minimum_evidence:
      - "Indicator, perspective, unit, currency or PPP, price year, release, artifact and rights selection."
  - id: "C"
    title: "Defer all source packets"
    disposition: "defer"
    trade_offs:
      - "Avoids any selection implication but makes no progress on Track 008 release identity."
    contingencies:
      - "Reopen when exact content rights and mapping-purpose evidence exist."
    rationale: "This is the most conservative option if metadata selection cannot remain operationally isolated."
    minimum_evidence:
      - "A demonstrated inability to keep the packet excluded from content and activation workflows."
recommendation:
  option_id: "A"
  rationale: "The exact metadata observation is useful and auditable while every substantive scientific and rights gate remains closed."
