perspectives:
  - role: "rights_and_data_use"
    observed:
      - "The v0.4 candidate is synthetic-only; both input ledgers and both exports are labelled synthetic with licence_state not_applicable."
      - "Public-source terms dispositions are now recorded (WHO default CC BY 4.0 posture with exact-receipt requirements; third-party credited fields excluded or separately permitted)."
      - "No controlled participant data, no custodian-dependent payload and no unreceipted real-source redistribution exists in the candidate."
    assessed:
      - >-
        Under ADR-0009 a synthetic/public-only release excludes claims that
        need unavailable facts or permissions and therefore needs no custodian
        receipt. The repository-controlled rights posture for freezing the
        v0.4 contract over this scope is clean: nothing in the frozen
        contract redistributes an unreceipted source.
    cannot_infer:
      - "Any third-party licensor permission; any future controlled-data custodian policy."
      - "Rights status of real sources not yet retrieved; those fail closed until exact receipts exist."
    dissent: []
  - role: "governance_and_security"
    observed:
      - "The real-data mandate prohibits restricted or individual-level payloads anywhere (repository, wheel, archive, API) until separate gates."
      - "Fail-closed negative tests cover missing provenance and unlawful acquisition outputs."
    assessed:
      - "Freezing the contract does not change data posture; it hardens the schema gate through which any future source must pass."
    cannot_infer:
      - "Operational security of future hosted surfaces."
    dissent: []
  - role: "engineering_and_release"
    observed:
      - "Ledger exports are schema-versioned and portable; licence_state is a first-class field."
    assessed:
      - "A scope-bounded freeze is implementable without weakening fail-closed release blockers for incomplete mandatory evidence."
    cannot_infer: []
    dissent: []
recommendation:
  option_id: "A"
  title: "accept_narrowed_freeze_scope_with_receipt_conditioned_activation"
  rationale: >-
    RIGHTS-01 as originally framed required custodian evidence only for scopes
    the candidate does not touch. Narrow the finding: freeze covers the
    synthetic-only candidate plus exactly-receipted public aggregates under
    recorded terms; every other source remains disabled pending exact receipts,
    and controlled-data deployment stays wholly outside v0.4 scope.
  conditions:
    - "Frozen contract embeds licence_state and source-receipt gating so unreceipted sources cannot activate."
    - "Any controlled-data or third-party-permission scope requires new facts, a fresh packet and owner disposition."
  contingencies:
    - "If any recorded terms disposition is withdrawn or corrected by its publisher, narrow or disable affected claims."
