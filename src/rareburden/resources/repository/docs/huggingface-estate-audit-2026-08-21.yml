ascertainment:
  all_sources_indexed:
    result: false
    rationale:
      - "catalog/data_sources.yml defines 16 project sources, while the archival decision matrix includes additional terminology and classification candidates"
      - "catalogue metadata reviews are preliminary and the semantic inventory explicitly says exact_supported_source_inventory_complete is false"
      - "bounded endpoint and release observations do not establish historical, language, edition, national-extension, or upstream-source completeness"
  all_source_metadata_archived:
    result: false
    rationale:
      - "metadata, notices, hashes, terms observations, and receipts exist for the acquired bounded snapshots"
      - "several catalogue sources remain selection-, access-, terms-, or custodian-pending and therefore lack an exact release/file archival packet"
      - "a source URL or catalogue row is not a byte- and revision-complete metadata archive"
  private_data_can_move_public:
    result: "some_exact_families_only"
    already_public:
      - "Orphadata and Orphacode rights-filtered snapshots"
      - "UN WPP 2024 exact workbook"
      - "World Bank bounded response"
      - "MONDO pinned releases"
      - "ClinVar 2026-08 pinned snapshot"
      - "rights-cleared HPO core subset and historical public HPO snapshots"
      - "Disease Ontology, Mammalian Phenotype Ontology, PATO, uPheno, and MeSH 2026 XML"
    remain_blocked:
      - "UMLS, SNOMED CT, RxNorm, and other UTS-controlled bytes"
      - "WHO ICD response bytes and WHO GHE workbook pending exact redistribution and third-party-field rights"
      - "PanelApp listing/details pending mixed-rights and reuse disposition"
      - "HPO artifacts outside the exact rights-cleared public projection"
      - "LOINC and other licensed or terms-unresolved terminology bytes"

owner_options:
  - id: "A"
    decision: "retain_current_split"
    trade_off: "lowest rights risk; private storage remains large"
  - id: "B"
    decision: "promote_only_new_exact_rights_cleared_batches"
    trade_off: "reduces duplication but requires file-level hashes, terms, notices, rollback, and a separate owner disposition per batch"
  - id: "C"
    decision: "make_private_repositories_public"
    trade_off: "unacceptable because controlled and unresolved-rights bytes are co-located"
    recommended: false
recommendation: "B"

required_before_each_new_public_batch:
  - "pin private source revision and exact paths"
  - "verify file sizes and SHA-256 digests"
  - "capture exact file-level licence and third-party restrictions"
  - "preserve attribution, notices, version, and change information"
  - "screen for controlled, personal, small-population, and culturally governed content"
  - "define destination paths, correction/takedown route, and rollback"
  - "obtain repository-owner disposition for the exact manifest"

claims:
  independent_review: false
  external_validation: false
  community_participation: false
  production_activation: false
  global_source_completeness: false
  metadata_completeness: false
  all_private_content_redistributable: false
