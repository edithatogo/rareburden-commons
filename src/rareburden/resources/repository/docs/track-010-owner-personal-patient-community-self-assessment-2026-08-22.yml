personal_findings:
  harms:
    - "Synthetic outputs could be mistaken for observed prevalence, lived experience or community burden."
    - "Aggregate estimates may erase heterogeneity, diagnostic barriers, unmet need and culturally specific meanings."
    - "Rankings or comparisons could enable stigma, profiling, rationing or service-eligibility misuse."
  accessibility_and_framing:
    - "Use plain-language uncertainty and synthetic-only labels at every output boundary."
    - "Do not present expected populations, case fractions or intervals as individual risk, eligibility, clinical guidance or community priorities."
    - "Provide a durable correction and harm-reporting route for repository materials."
  acceptable_use_conditions:
    - "Non-clinical synthetic assurance and technical documentation only."
    - "No individual decisions, diagnosis, treatment, ranking, rationing, policing, insurance, employment, immigration or service-eligibility use."
  benefit_or_return_expectations: "No community benefit, return, partnership or endorsement is claimed; any future engagement must define scope and return separately."
limitations_and_dissent:
  - "This is a personal owner perspective, not community consultation, representation, consent, endorsement, cultural-safety evidence or Indigenous authority."
  - "Simulated panel advice may miss lived harms, cultural context and access barriers."
  - "A stricter option would defer all community-facing interpretation pending attributable external evidence."
correction_withdrawal_route: "Owner may amend or withdraw this personal self-assessment through a superseding dated receipt; hash-bound candidate changes invalidate it."
stop_triggers:
  - "Wording generalises the owner's perspective to patients or communities."
  - "Consent, endorsement, partnership, authority or representation is inferred from this receipt."
  - "Synthetic output is used clinically, individually, representatively or for eligibility/rationing decisions."
  - "Candidate or artifact hash drift, unsafe or stigmatizing framing, or loss of a correction route."
