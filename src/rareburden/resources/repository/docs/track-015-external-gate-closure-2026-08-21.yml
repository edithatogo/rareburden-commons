schema_version: '1.1.0'
track: 015-governance-partnership-policy
attempted_at: '2026-08-21'
status: blocked_dependency_only_external_activation_excluded
track_completion_authorized: false
internal_governance_model:
  repository_model: single_person_repo
  decision_maker: repository_owner
  panels: role_separated_simulated_advisory_agents
  grouped_advice_fields: [options, contingencies, rationale, trade_offs, recommendation]
  independent_or_additional_human_advice_required: false
  constituted_governance_body_required: false
  repository_data_custodian: repository_owner
  applicable_indigenous_authority: repository_owner
  authority_basis: attributable_owner_declaration
  remuneration: none
  amount: 0

boundary: >-
  Agent advice plus owner disposition completes repository governance. A
  third-party receipt is required only before activating a capability or claim
  that depends on that party's rights, permission, relationship,
  representation or jurisdictional authority.

dependency_blockers:
  - track: 013-quality-validation-gap-equity
    required_state: complete
    current_state: blocked

repository_governance_gates_completed:
  - id: community_harm_advice
    acceptance_criteria: [1]
    evidence: docs/track-015-patient-community-governance-advice-2026-08-20.yml
    decision_model: role_separated_agent_advice_and_owner_disposition
  - id: methods_rights_and_node_advice
    acceptance_criteria: [2]
    evidence: docs/single-owner-agent-governance.yml
    decision_model: role_separated_agent_advice_and_owner_disposition
  - id: operating_policy_approval_and_test
    acceptance_criteria: [3, 4]
    evidence: docs/decisions/2026-08-21-track-015-owner-operating-policy-disposition.yml
    decision_model: role_separated_agent_advice_and_owner_disposition
  - id: owner_scope_and_conditional_authority
    acceptance_criteria: [5]
    evidence: docs/decisions/2026-08-21-owner-custodian-indigenous-authority.md
    decision_model: owner_declaration_with_unrelated_scope_excluded
  - id: bounded_geographic_claims
    acceptance_criteria: [7]
    evidence: docs/track-015-policy-user-tabletop-2026-08-21.yml
    decision_model: role_separated_agent_advice_and_owner_disposition
  - id: bounded_governance_readiness
    acceptance_criteria: [8]
    evidence: conductor/tracks/015-governance-partnership-policy/review.md
    decision_model: role_separated_agent_advice_and_owner_disposition

conditional_external_fact_gates:
  - id: publisher_or_licensor_rights
    status: not_applicable_until_material_used
    accountable_authority: applicable publisher or licensor
    required_receipts: [scope_matched_terms_or_licence]
    self_attestable: false
  - id: controlled_data_custodian_permission
    status: not_applicable_until_controlled_data_activated
    accountable_authority: applicable custodian
    required_receipts: [permitted_scope_outputs_and_operating_terms]
    self_attestable: false
  - id: relationship_or_endorsement
    status: not_applicable_until_claimed
    accountable_authority: named counterparty
    required_receipts: [written_relationship_or_endorsement_confirmation]
    self_attestable: false
  - id: country_node_or_jurisdictional_authority
    status: not_applicable_until_node_activated
    accountable_authority: applicable node custodian and jurisdictional authority
    required_receipts: [node_agreement_authority_and_withdrawal_terms]
    self_attestable: false
  - id: unrelated_community_or_indigenous_authority
    status: not_applicable_until_consent_or_representation_claimed
    accountable_authority: applicable unrelated community or Indigenous authority
    required_receipts: [scope_matched_consent_or_representation_and_withdrawal_route]
    self_attestable: false
  - id: unqualified_global_or_representative_claim
    status: not_applicable_while_claim_prohibited
    accountable_authority: represented jurisdictions and applicable communities
    required_receipts: [representation_and_LMIC_led_participation_evidence]
    self_attestable: false

repository_evidence_completed:
  - bounded single-owner and role-separated agent-panel controls
  - owner-approved integrated operating policy and owner-operated tabletop
  - relationship claim-state and correction/withdrawal enforcement
  - non-contact partnership map and bounded geographic claims
  - exact candidate, tree and scope-manifest binding

safe_continuation:
  - use role-separated agents for repository advisory challenge
  - keep every third-party-dependent capability or claim inactive until evidenced
  - rerun the affected exact-candidate review after any material scope change

prohibited_activation_claims:
  - independent human review
  - authority or consent for unrelated Indigenous peoples or communities
  - third-party custodian, publisher, licensor or partner approval
  - global representativeness
  - controlled-data or country-node activation

resume_condition: >-
  Track 013 reaches complete. Conditional external receipts are required only
  before their corresponding third-party-dependent capability or claim is
  activated.
