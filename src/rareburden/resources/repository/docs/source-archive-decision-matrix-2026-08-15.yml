  - private_hosting_is_copying_and_requires_a_documented_basis
  - exact_release_identity_and_sha256_are_required_for_raw_archival
  - controlled_environment_data_must_never_be_exported_to_github_or_huggingface
  - raw_files_do_not_activate_estimands_or establish_clinical_validity
  - publisher_licence_and_third_party_rights_facts_cannot_be_overridden_by_owner_or_agents
