schema_version: "0.1.0"
decision: "repository_owner_approved_bounded_preparation"
activation: "disabled_until_exact_owner_activation_and_publisher_rights"
primary_preparation_sources:
  - source_id: "orphadata-science"
    role: "descriptive_epidemiology_and_identifier_alignment"
    status: "conditional_candidate"
  - source_id: "un-world-population-prospects"
    role: "bounded_medium_variant_national_population_denominator"
    status: "conditional_candidate"
deferred_candidates:
  - source_id: "who-global-health-estimates"
    role: "year_2000_aggregate_comparator_only"
    status: "candidate_only"
  - source_id: "world-bank-indicators-api"
    role: "bounded_population_probe_or_cross_check"
    status: "probe_only"
exclusions:
  - "no_raw_third_party_source_bytes_in_repository_or_release"
  - "no_unapproved_age_sex_interpolation"
  - "no_disease_burden_inference_from_population_denominators"
  - "no_novelty_completeness_partnership_or_endorsement_claims"
release_gate: "track_007_external_challenge_and_track_002_receipts"
