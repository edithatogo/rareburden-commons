observed_provider_evidence:
  hugging_face:
    storage_limits_url: https://huggingface.co/docs/hub/main/en/storage-limits
    pricing_url: https://huggingface.co/pricing
    observed_at: "2026-08-16"
    observations:
      - Free private storage is documented as 100 GB.
      - PRO private storage is documented as 1 TB included with pay-as-you-go above it.
      - Additional private repository storage is documented at a base USD 18 per TB-month.
