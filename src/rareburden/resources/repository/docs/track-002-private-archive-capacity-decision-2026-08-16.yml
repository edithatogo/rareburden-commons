  s3_reference:
    pricing_url: https://aws.amazon.com/s3/pricing/
    access_control_url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-management.html
    object_lock_url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
    observed_at: "2026-08-16"
    observations:
      - Object storage charges vary by region, storage class, stored bytes, requests, retrieval and transfer.
      - S3 supports private access controls, encryption, versioning and optional object lock.
      - Object lock requires versioning and can increase retained storage and operational complexity.
    volatility: Select a provider and region, then obtain an exact calculator or quote before purchase.
options:
  - id: A
    name: increase_hugging_face_private_capacity
    disposition: recommended_after_cost_cap
    benefits:
      - Reuses the existing private repository, receipts, hashes, paths and GitHub Actions integration.
      - Avoids a licensed-byte migration and preserves the already verified remote checkpoint.
      - Current published base private-storage pricing is lower than the AWS S3 Standard comparison headline.
      - Published Hugging Face pricing includes egress, reducing restore-cost uncertainty.
    tradeoffs:
      - Requires a paid account/capacity decision and an exact current quote.
      - Remaining byte volume is unknown, so total monthly cost cannot yet be calculated responsibly.
      - Personal-account governance, region and audit controls may be weaker than a selected enterprise object store.
      - Git repository history can retain superseded large objects and complicate deletion/withdrawal.
    contingencies:
      quota_repeats: Return to blocked state without redownload or cursor advancement.
      price_exceeds_cap: Evaluate Option B against an exact provider quote or retain Option C.
      retention_or_region_inadequate: Use Option B only after a security and migration checklist passes.
  - id: B
    name: private_s3_compatible_object_store
    disposition: conditional_fallback
    benefits:
      - Separates immutable licensed payload objects from public code and metadata.
      - Can provide explicit region, encryption, lifecycle, versioning, access-log and object-lock controls.
      - Object keys and sidecar receipts map naturally to the existing content-addressed archive contract.
    tradeoffs:
      - Requires provider, region, account, budget and credential decisions plus new automation and recovery tests.
      - Storage price alone is incomplete; requests, retrieval, egress, minimum-duration and early-deletion charges may apply.
      - Migrating verified HF objects can require reading licensed bytes and creates a second checkpoint to reconcile.
      - Versioning or object lock can increase cost and make withdrawal/deletion harder.
    contingencies:
      migration_not_authorized: Leave existing HF objects in place and route only future objects after a reviewed cutover.
      provider_unavailable: Preserve manifests/hashes under Option C; do not download source bytes without a writable verified destination.
      integrity_mismatch: Stop migration, retain both receipts and do not advance either cursor.
  - id: C
    name: pause_raw_history_metadata_hashes_only
    disposition: current_safe_default
    benefits:
      - Incurs no new private-storage commitment and is already enforced fail-closed.
      - Preserves release identities, URLs, family cursors, existing hashes and verified receipts without duplicate downloads.
      - Allows a later destination decision without falsely claiming archive completeness.
    tradeoffs:
      - Historical bytes remain dependent on continued publisher availability and licensed access.
      - Future source withdrawal or change could prevent later exact-byte preservation.
      - Metadata and hashes alone cannot reproduce an unavailable payload.
    contingencies:
      source_withdrawal_observed: Record the loss and affected releases; do not infer or reconstruct missing bytes.
      capacity_restored: Require a dated expiring preflight and one-artifact canary before resumption.
recommendation:
  immediate: C
  preferred_resumption: A
  rationale: >-
    Keep the existing enforced pause while the remaining byte volume and exact
    account price are unknown. Prefer a bounded Hugging Face capacity increase
    if the owner accepts an explicit monthly cost cap because it preserves the
    verified checkpoint and avoids a licensed-byte migration. Use an
    S3-compatible store only if an exact quote or required security, region,
    retention or withdrawal controls materially outweigh migration complexity.
  owner_decisions_required:
    - Maximum recurring monthly storage spend and billing currency.
    - Whether the current Hugging Face account controls and storage region are acceptable for the licensed archive.
    - If not, the selected S3-compatible provider, region, retention period and deletion/withdrawal policy.
  actions_not_authorized:
    - Purchasing or upgrading a plan.
    - Creating an object-store account or bucket.
    - Uploading, migrating or redownloading licensed bytes.
    - Changing the checked-in capacity state to ready.
stop_conditions:
  - Any licence or cloud-storage term does not permit the selected private destination.
  - A destination is not private or least-privilege access cannot be enforced.
  - The exact quote exceeds the owner-approved cost cap.
  - Capacity, integrity, hash, receipt, retention or recovery verification fails.
  - A migration would require uncontrolled local persistence or expose credentials.
