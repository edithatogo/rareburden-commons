proposed_tracks:
  - alias: "008A"
    canonical_id: "008-semantic-backbone"
    proposed_title: "Bounded non-clinical semantic infrastructure"
    candidate_state: "blocked_pending_exact_scope_disposition"
    retained_outputs:
      - "versioned disease-definition, hierarchy and mapping schemas"
      - "stable internal identifiers and explicit ambiguity relations"
      - "hash-bound provisional ORPHA-to-MONDO interoperability rows"
      - "source-native provisional naming artifacts"
      - "hierarchy conservation, overlap, migration and deprecation controls"
      - "synthetic demonstrator fixtures and deterministic release tooling"
    narrowed_acceptance:
      - "every distributed artifact has an exact source, transformation, rights route and hash"
      - "uncertain, one-to-many and unsupported mappings fail closed"
      - "actual candidate hierarchy and overlap checks pass"
      - "synthetic demonstrator definitions reconstruct from the bounded release"
      - "updates produce a reviewable migration diff and invalidate affected outputs"
      - "all labels and mappings remain visibly provisional and non-clinical"
      - "no clinical, community-authority, comprehensive-coverage or independent-review claim is made"
    deferred_to: "019-clinical-community-semantic-assurance"
  - alias: "008B"
    canonical_id: "019-clinical-community-semantic-assurance"
    proposed_title: "Clinical, community and extended-source semantic assurance"
    candidate_state: "proposed_not_registered_or_active"
    transferred_obligations:
      - "attributable patient and community review of naming and aggregation harms"
      - "clinical and semantic-methods mapping-fitness review"
      - "independent semantic and engineering review"
      - "derivative-publication and field-level third-party rights dispositions"
      - "extended HPO, WHO ICD, UMLS, SNOMED CT and OMIM source decisions"
      - "patient-facing, clinical, representative or production semantic authorization"
