[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "rareburden"
version = "0.3.0rc2"
description = "Reproducibility, provenance and burden-estimation utilities for RareBurden Commons"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "jsonschema>=4.20,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15,<1",
  "setuptools>=77,<84",
  "twine>=6.1,<7",
  "types-PyYAML>=6.0.12,<7",
  "zizmor>=1.27,<2",
]

[project.scripts]
rareburden = "rareburden.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rareburden = ["py.typed", "resources/repository/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers --timeout=30"

[tool.coverage.run]
branch = true
source = ["rareburden"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["rareburden"]

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "jsonschema"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rareburden"]
